# Reverse-proxy front end for the Sunseekers CRM stack.
#
# Dokploy builds compose domain service URLs as http://<appName>:<port>,
# where appName is the single hostname it knows for a compose project. This
# container carries that hostname as a network alias and exposes one listener
# per service port, so all four domains can share the one hostname Dokploy
# expects. Without it, Dokploy's generated config points at a name that does
# not resolve on dokploy-network.
#
# Routing is port-based (each domain is registered on a distinct port), so the
# public Host header is passed through untouched for the upstream apps.

resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 3000;
    server_name _;
    client_max_body_size 25m;
    location / {
        set $upstream http://backend:3000;
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

