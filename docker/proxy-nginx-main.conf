worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Port fan-out lives in conf.d/default.conf
    include       /etc/nginx/conf.d/*.conf;

    # Required by the per-server "Connection $connection_upgrade" header so
    # websocket upgrades survive the hop (CRM uses SSE/websockets for live data).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    sendfile      on;
    keepalive_timeout 65;
}
