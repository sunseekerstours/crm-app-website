name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (lint, typecheck, build, tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sunseekers
          POSTGRES_PASSWORD: sunseekers
          POSTGRES_DB: sunseekers
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U sunseekers"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://sunseekers:sunseekers@localhost:5432/sunseekers?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_ACCESS_SECRET: ci-access-secret-32-characters-minimum
      JWT_REFRESH_SECRET: ci-refresh-secret-32-characters-minimum
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/backend
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build (typecheck)
        run: npm run build

      - name: Unit tests
        working-directory: apps/backend
        run: npm test

      - name: Deploy migrations
        working-directory: apps/backend
        run: npx prisma migrate deploy

      - name: Seed roles/admin
        working-directory: apps/backend
        run: npm run db:seed

      - name: E2E tests
        working-directory: apps/backend
        run: npm run test:e2e
