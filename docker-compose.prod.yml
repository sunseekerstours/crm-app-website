name: sunseekers-crm

# Dokploy builds compose domain service URLs as http://<appName>:<port>, where
# appName is the single hostname it knows for this project. The proxy below
# answers to that hostname and fans out to the four services by port, so the
# Domains tab in Dokploy is the single source of truth for routing.
#
# DOKPLOY_APPNAME must match the compose appName in the Dokploy database. If
# the service is ever recreated and Dokploy issues a new random suffix, update
# it here (and redeploy) or the domains will stop resolving.
x-dokploy-appname: &dokployAppName sunseekers-crm-75eab8

services:
  db:
    image: postgres:16-alpine
    container_name: sunseekers-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sunseekers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sunseekers}
    volumes:
      - sunseekers_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sunseekers} -d ${POSTGRES_DB:-sunseekers}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: sunseekers-redis
    restart: unless-stopped
    volumes:
      - sunseekers_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: sunseekers-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-sunseekers}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sunseekers}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_TTL: 900
      JWT_REFRESH_TTL: 604800
      BCRYPT_SALT_ROUNDS: 10
      CORS_ORIGINS: https://sunseekers-crm-69-62-106-189.sslip.io,https://sunseekers-admin-69-62-106-189.sslip.io,https://sunseekers-site-69-62-106-189.sslip.io,http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sunseeker.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AUTOMATION_ENABLED: "true"
      AUTOMATION_INTERVAL_MS: "3600000"
      AUTOMATION_REMINDER_WINDOW_DAYS: "3"
      AUTOMATION_STALE_LEAD_DAYS: "7"
      AUTOMATION_INVOICE_OVERDUE_DAYS: "1"
      JETPACK_CRM_ENABLED: ${JETPACK_CRM_ENABLED:-false}
      JETPACK_CRM_ENDPOINT: ${JETPACK_CRM_ENDPOINT:-https://sunseekerstours.com/zbs_api/}
      JETPACK_CRM_API_KEY: ${JETPACK_CRM_API_KEY:-}
      JETPACK_CRM_API_SECRET: ${JETPACK_CRM_API_SECRET:-}
    networks:
      - default
      - dokploy-network

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://sunseekers-api-69-62-106-189.sslip.io/api/v1
    container_name: sunseekers-admin
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3003
      NEXT_PUBLIC_API_URL: https://sunseekers-api-69-62-106-189.sslip.io/api/v1
    networks:
      - default
      - dokploy-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://sunseekers-api-69-62-106-189.sslip.io/api/v1
    container_name: sunseekers-crm
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: https://sunseekers-api-69-62-106-189.sslip.io/api/v1
    networks:
      - default
      - dokploy-network

  site:
    build:
      context: .
      dockerfile: apps/site/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://sunseekers-api-69-62-106-189.sslip.io/api/v1
    container_name: sunseekers-site
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3002
      NEXT_PUBLIC_API_URL: https://sunseekers-api-69-62-106-189.sslip.io/api/v1
    networks:
      - default
      - dokploy-network

  # Single entrypoint for all four public domains.
  # Exposes 3000 (api), 3001 (crm), 3002 (site), 3003 (admin) and answers to
  # the Dokploy appName so the Domains tab generates working config.
  proxy:
    image: nginx:1.27-alpine
    container_name: sunseekers-proxy
    restart: unless-stopped
    depends_on:
      - backend
      - web
      - site
      - admin
    volumes:
      - ./docker/proxy-nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ./docker/proxy-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
        aliases:
          - *dokployAppName
      dokploy-network:
        aliases:
          - *dokployAppName
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  sunseekers_pgdata:
  sunseekers_redis_data:

networks:
  dokploy-network:
    external: true
